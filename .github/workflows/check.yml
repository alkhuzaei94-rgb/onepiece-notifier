name: Check for new One Piece chapter

# Why it works this way: GitHub's cron scheduler is best-effort and, in
# practice, a "*/15" schedule on this repo only fired every 4-8 hours, so
# chapters were being announced hours late.
#
# Now, during the Wed-Fri (UTC) release window, a run stays alive and checks
# the site every 60s for up to ~5.5h, then starts the next run itself
# (workflow_dispatch) so coverage is continuous until a chapter is found or
# the window closes. The cron entries below are only a kick-starter / safety
# net to (re)start that chain; outside the window each run is a single check.
on:
  schedule:
    - cron: "7,37 * * * 3,4,5"       # Wed-Fri: restart the watch chain if it broke
    - cron: "17 */3 * * 0,1,2,6"     # rest of week: occasional single check
  workflow_dispatch: {}

permissions:
  contents: write   # push last_chapter.txt
  actions: write    # start the next watch run

# No `concurrency:` group on purpose: queued runs that GitHub cancels each
# send a "run cancelled" notification. Instead, scheduled runs just exit
# quietly (success) when a watcher is already running — see the first step.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Skip if a watcher is already running
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for st in in_progress queued; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/check.yml/runs?status=$st&per_page=20" \
                  --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length')
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then
            echo "Another run is already active; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # Use the branch tip, not the SHA from when this run was queued, so a
          # run that waited behind a watcher sees its updated last_chapter.txt.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Check / watch for new chapter
        if: steps.guard.outputs.skip != 'true'
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_SECONDS: "60"
        run: python -u check_chapter.py

      - name: Commit updated last_chapter.txt
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.found == 'true'
        run: |
          git config user.name "chapter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_chapter.txt
          if ! git diff --cached --quiet; then
            git commit -m "New chapter detected"
            # The watcher may have been running for hours; pick up any newer commits.
            git pull --rebase
            git push
          fi

      - name: Start next watch run
        if: steps.guard.outputs.skip != 'true' && steps.check.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref "${{ github.ref_name }}"
