name: Check for new One Piece chapter

on:
  schedule:
    # NOTE: all cron times are UTC. TCB One Piece chapters normally drop
    # Wed-Fri (most often Thursday), so check every 15 min during that window
    # for a fast notification...  (day-of-week: Wed=3, Thu=4, Fri=5)
    - cron: "*/15 * * * 3,4,5"
    # ...and keep a lighter safety net every 3 hours the rest of the week
    # (Sun/Mon/Tue/Sat) in case a release is early, delayed into the weekend,
    # or shifted by a break. GitHub cron is best-effort and may lag 5-15 min.
    - cron: "0 */3 * * 0,1,2,6"
  workflow_dispatch: {}

# Allow the job to push the updated last_chapter.txt back to the repo.
permissions:
  contents: write

# Never let two runs race on the commit/push of last_chapter.txt.
concurrency:
  group: chapter-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new chapter
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_chapter.py

      - name: Commit updated last_chapter.txt
        run: |
          git config user.name "chapter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_chapter.txt
          git diff --cached --quiet || git commit -m "New chapter detected" && git push
